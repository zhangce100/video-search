<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="影视搜索">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>全网影视搜索</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a12;--card:#14141f;--card-f:#1c1c2e;--ac:#7c5cfc;--ac2:#00d4aa;--t:#f0f0f8;--t2:#7878a0;--bd:#252540;--r:14px;--fs:18px;--fs-s:14px;--fs-l:26px;--fs-xl:36px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:var(--fs)}
.f:focus,.f:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:var(--r);z-index:10}
.f{transition:transform .15s,box-shadow .15s,border-color .15s}
.f:focus{transform:scale(1.03);box-shadow:0 0 24px rgba(124,92,252,.35)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.topbar{display:flex;align-items:center;padding:14px 20px;gap:12px;background:rgba(10,10,18,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd);flex-shrink:0}
.logo{font-size:var(--fs-l);font-weight:900;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;cursor:pointer;flex-shrink:0}
.sw{flex:1;position:relative;max-width:600px}
.sw input{width:100%;padding:12px 48px 12px 16px;font-size:var(--fs);border-radius:var(--r);border:2px solid var(--bd);background:var(--card);color:var(--t);outline:none}
.sw input:focus{border-color:var(--ac);box-shadow:0 0 0 4px rgba(124,92,252,.2)}
.sw input::placeholder{color:var(--t2)}
.sw .go{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:10px;background:var(--ac);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 20px;border-radius:22px;border:2px solid var(--bd);background:transparent;color:var(--t2);font-size:var(--fs-s);cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab:focus{border-color:var(--ac);color:var(--t);transform:scale(1.05)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 20px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{width:5px}
.content::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
.sec{margin-bottom:24px}
.sec-h{font-size:var(--fs-s);color:var(--t2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-h::before{content:'';width:4px;height:16px;border-radius:2px;background:var(--ac)}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.card{flex-shrink:0;width:160px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;border:2px solid transparent}
.card:focus{border-color:var(--ac);transform:scale(1.04);box-shadow:0 12px 36px rgba(124,92,252,.3)}
.card .poster{width:100%;aspect-ratio:2/3;background:var(--card-f);display:flex;align-items:center;justify-content:center;font-size:48px;opacity:.3;position:relative}
.card .badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);padding:2px 8px;border-radius:6px;font-size:12px;color:var(--ac2);font-weight:700}
.card .info{padding:8px 10px}
.card .title{font-size:var(--fs-s);font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:12px;color:var(--t2);margin-top:3px}
.wcard{display:flex;gap:12px;padding:12px;background:var(--card);border-radius:var(--r);border:2px solid transparent;cursor:pointer;margin-bottom:8px}
.wcard:focus{border-color:var(--ac);transform:scale(1.01);box-shadow:0 8px 28px rgba(124,92,252,.25)}
.wcard .thumb{width:160px;height:100px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--card-f);display:flex;align-items:center;justify-content:center;font-size:32px;opacity:.3;position:relative}
.wcard .thumb img{width:100%;height:100%;object-fit:cover}
.wcard .thumb .dur{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.85);padding:1px 6px;border-radius:4px;font-size:11px;color:#fff}
.wcard .body{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.wcard .body .t{font-size:var(--fs);font-weight:700;margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard .body .d{font-size:var(--fs-s);color:var(--t2);line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard .body .f2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.src-tag{font-size:11px;color:var(--ac);font-weight:700;background:rgba(124,92,252,.1);padding:2px 8px;border-radius:5px}
.meta-tag{font-size:11px;color:var(--t2)}
.stats{display:flex;gap:16px;padding:8px 0;font-size:var(--fs-s);color:var(--t2);flex-wrap:wrap}
.stats .v{color:var(--ac);font-weight:700}
.sfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;flex-wrap:nowrap}
.sfilter::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:8px;border:2px solid var(--bd);color:var(--t2);font-size:var(--fs-s);cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip:focus{border-color:var(--ac);color:var(--t);transform:scale(1.05)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pag{display:flex;justify-content:center;gap:8px;padding:14px 0}
.pg{padding:8px 18px;border-radius:8px;border:2px solid var(--bd);background:transparent;color:var(--t2);font-size:var(--fs-s);cursor:pointer}
.pg:focus{border-color:var(--ac);color:var(--t);transform:scale(1.05)}
.pg.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pg:disabled{opacity:.3;cursor:default}
.loading{text-align:center;padding:50px 0;color:var(--t2);font-size:var(--fs)}
.spin{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--t2)}
.empty .ei{font-size:64px;margin-bottom:12px;opacity:.4}
.empty .et{font-size:var(--fs);margin-bottom:6px}
.empty .eh{font-size:var(--fs-s);opacity:.7}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:520px;width:100%;padding:22px;border:2px solid var(--bd);max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal .close{float:right;background:none;border:none;color:var(--t2);font-size:24px;cursor:pointer;padding:4px 8px}
.modal .close:focus{color:var(--ac)}
.modal h2{font-size:var(--fs-l);margin-bottom:8px}
.modal .desc{font-size:var(--fs);color:var(--t2);line-height:1.5;margin-bottom:14px}
.modal .sec-l{font-size:var(--fs-s);color:var(--t2);margin-bottom:8px;font-weight:700}
.ml{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.ml a{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(124,92,252,.06);border-radius:10px;border:2px solid var(--bd);text-decoration:none;color:var(--t);font-size:var(--fs)}
.ml a:focus{border-color:var(--ac);transform:scale(1.01);box-shadow:0 4px 16px rgba(124,92,252,.2)}
.ml .li{width:34px;height:34px;border-radius:8px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.ml .ln{font-weight:700}
.ml .lu{font-size:12px;color:var(--t2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--bd);padding:10px 22px;border-radius:12px;font-size:var(--fs-s);z-index:200;display:none}
.toast.show{display:block;animation:up .3s ease}
@keyframes up{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.install-btn{position:fixed;bottom:16px;right:16px;padding:12px 20px;background:var(--ac);color:#fff;border:none;border-radius:12px;font-size:var(--fs-s);font-weight:700;cursor:pointer;z-index:50;display:none;box-shadow:0 4px 20px rgba(124,92,252,.4)}
.install-btn:focus{transform:scale(1.05)}
@media(max-width:600px){
  :root{--fs:16px;--fs-s:13px;--fs-l:22px}
  .topbar{padding:10px 14px;gap:8px}
  .tabs{padding:8px 14px}
  .content{padding:0 14px 14px}
  .card{width:130px}
  .wcard{gap:8px;padding:8px}
  .wcard .thumb{width:120px;height:75px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo" onclick="goHome()">🎬 影视搜索</div>
    <div class="sw">
      <input type="text" id="q" placeholder="🔍 搜索电影、电视剧、动漫..." autocomplete="off">
      <button class="go f" onclick="doSearch()">🔍</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <button class="close f" onclick="closeModal()">✕</button>
    <h2 id="mT"></h2>
    <p class="desc" id="mD"></p>
    <div class="sec-l">📺 观看 / 搜索</div>
    <div class="ml" id="mL"></div>
    <div class="sec-l">🔗 更多平台</div>
    <div class="ml" id="mE"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<button class="install-btn" id="installBtn" onclick="installApp()">📲 安装到本机</button>

<script>
// ─── PWA ──────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').style.display='block'});
window.addEventListener('appinstalled',()=>{$('#installBtn').style.display='none';showToast('✅ 已安装到桌面')});
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')$('#installBtn').style.display='none';deferredPrompt=null})}
  else{showToast('请使用浏览器菜单 → 添加到主屏幕')}
}

// ─── App ──────────────────────────────────────────────────────────────────────
const $=s=>document.querySelector(s);
const API_DEFAULT=location.protocol==='file:'?'http://localhost:9000':'';
let API=API_DEFAULT;
try{const s=localStorage.getItem('api');if(s)API=s}catch{}

let curQ='',curCat='all',curPage=1,curSrc='all',lastResp=null;
const CATS=[{id:'all',name:'全部'},{id:'movie',name:'电影'},{id:'tv',name:'电视剧'},{id:'anime',name:'动漫'},{id:'variety',name:'综艺'},{id:'docu',name:'纪录片'},{id:'short',name:'短视频'},{id:'music',name:'MV'}];
const HOT=['流浪地球3','三体','哪吒','鬼灭之刃','庆余年3','黑神话悟空','漫威','日漫新番','蓝色星球','歌手2026','抖音热榜','韩剧推荐'];
const PLAT_GROUPS=[
  {label:'🔥 热门搜索',items:HOT.map(k=>({name:k,search:true}))},
  {label:'📺 免费直接可用',items:[{id:'bilibili',name:'B站'},{id:'youtube',name:'YouTube'},{id:'dailymotion',name:'Dailymotion'},{id:'archive',name:'Archive'},{id:'peertube',name:'PeerTube'},{id:'odysee',name:'Odysee'}]},
  {label:'🎬 国内平台',items:[{id:'douyin',name:'抖音'},{id:'kuaishou',name:'快手'},{id:'xigua',name:'西瓜视频'},{id:'haokan',name:'好看视频'},{id:'weibo',name:'微博'},{id:'xiaohongshu',name:'小红书'},{id:'acfun',name:'AcFun'},{id:'douban',name:'豆瓣'}]},
  {label:'🌸 动漫专区',items:[{id:'crunchyroll',name:'Crunchyroll'},{id:'mal',name:'MAL'},{id:'niconico',name:'Niconico'},{id:'dmhy',name:'动漫花园'},{id:'age',name:'AGE动漫'},{id:'yhdmm',name:'樱花动漫'}]},
  {label:'🌐 海外平台',items:[{id:'rumble',name:'Rumble'},{id:'twitch',name:'Twitch'},{id:'ted',name:'TED'},{id:'imdb',name:'IMDB'}]},
  {label:'🆓 免费流媒体',items:[{id:'tubi',name:'Tubi'},{id:'pluto',name:'Pluto TV'},{id:'plex',name:'Plex'},{id:'kanopy',name:'Kanopy'},{id:'openculture',name:'Open Culture'}]},
  {label:'🔗 资源聚合站',items:[{id:'cupfox',name:'茶杯狐'},{id:'ddys',name:'低端影视'},{id:'libvio',name:'LIBVIO'},{id:'zxzj',name:'在线之家'},{id:'dsxys',name:'大师兄'},{id:'bde4',name:'哔嘀影视'}]}
];

function init(){
  renderTabs();renderHome();bindKeys();
  if(!API)showApiPrompt();
  else testApi();
}
function bindKeys(){
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'||e.key==='Backspace'){if($('#modal').classList.contains('show')){closeModal();e.preventDefault()}}
    if(e.key==='/'&&document.activeElement!==$('#q')){$('#q').focus();e.preventDefault()}
    if(e.key==='Enter'&&document.activeElement===$('#q')){doSearch();e.preventDefault()}
  });
}
async function testApi(){
  try{const r=await fetch(`${API}/health`,{signal:AbortSignal.timeout(3000)});if(!r.ok)throw 0}catch{showToast('⚠️ API未连接，请检查服务器')}
}
function showApiPrompt(){
  const url=prompt('请输入API服务器地址\n\n例如: http://192.168.1.100:9000\n（如果本机已启动，填 http://localhost:9000）');
  if(url){API=url.replace(/\/$/,'');localStorage.setItem('api',API);testApi();renderHome()}
}
function goHome(){curQ='';$('#q').value='';renderTabs();renderHome()}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function renderTabs(){$('#tabs').innerHTML=CATS.map(c=>`<div class="tab f ${c.id===curCat?'on':''}" tabindex="0" data-c="${c.id}" onclick="setCat('${c.id}')">${c.name}</div>`).join('')}
function setCat(id){curCat=id;$$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.c===id));if(curQ)doSearch()}
const $$=s=>document.querySelectorAll(s);

function renderHome(){
  let h='<div class="sec"><div class="sec-h">🔥 热门推荐</div><div class="hrow" id="trendRow"></div></div>';
  for(const g of PLAT_GROUPS){
    h+=`<div class="sec"><div class="sec-h">${g.label}</div><div class="hrow">`;
    for(const p of g.items){
      if(p.search) h+=`<div class="card f" tabindex="0" onclick="qs('${p.name}')"><div class="poster">🔍</div><div class="info"><div class="title">${p.name}</div></div></div>`;
      else h+=`<div class="card f" tabindex="0" onclick="qs('${p.name}')"><div class="poster">📺</div><div class="info"><div class="title">${p.name}</div></div></div>`;
    }
    h+='</div></div>';
  }
  h+=`<div style="text-align:center;padding:20px;font-size:12px;color:var(--t2)"><a href="#" onclick="showApiPrompt();return false" style="color:var(--ac)">⚙️ 设置API地址</a></div>`;
  $('#content').innerHTML=h;
  loadTrending();
}
async function loadTrending(){
  try{const r=await fetch(`${API}/trending`);const d=await r.json();const row=$('#trendRow');if(!row)return;
  row.innerHTML=(d.items||[]).map(i=>`<div class="card f" tabindex="0" onclick="qs('${i.title}')"><div class="poster">${i.emoji||'🎬'}${i.rating?`<div class="badge">⭐ ${i.rating}</div>`:''}</div><div class="info"><div class="title">${i.title}</div><div class="meta">${i.year||''}</div></div></div>`).join('')}catch{}
}
function qs(q){$('#q').value=q;doSearch()}
async function doSearch(){
  const q=$('#q').value.trim();if(!q)return;if(!API){showApiPrompt();return}
  curQ=q;curPage=1;curSrc='all';renderTabs();
  const c=$('#content');c.innerHTML='<div class="loading"><div class="spin"></div>正在搜索 40+ 个平台...</div>';
  try{
    const r=await fetch(`${API}/search?q=${enc(curQ)}&cat=${curCat}&page=${curPage}&page_size=20`);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);lastResp=await r.json();renderResults(lastResp);
  }catch(e){c.innerHTML=`<div class="empty"><div class="ei">⚠️</div><div class="et">搜索出错</div><div class="eh">${e.message}</div><div style="margin-top:16px"><button class="pg f" onclick="doSearch()" tabindex="0">重试</button> <button class="pg f" onclick="goHome()" tabindex="0">首页</button></div></div>`}
}
function renderResults(d){
  const c=$('#content');let items=d.items||[];
  let h=`<div class="stats"><span>找到 <span class="v">${d.total}</span> 条</span><span>耗时 <span class="v">${d.elapsed_ms}ms</span></span><span>源: <span class="v">${(d.sources_searched||[]).length}</span> 个平台</span></div>`;
  const counts={};items.forEach(i=>{counts[i.source]=(counts[i.source]||0)+1});
  const names={bilibili:'B站',youtube:'YouTube',dailymotion:'Dailymotion',archive:'Archive',peertube:'PeerTube',odysee:'Odysee',vimeo:'Vimeo',rumble:'Rumble',twitch:'Twitch',ted:'TED',douyin:'抖音',kuaishou:'快手',xigua:'西瓜',haokan:'好看',weibo:'微博',xiaohongshu:'小红书',acfun:'AcFun',douban:'豆瓣',crunchyroll:'CR',mal:'MAL',niconico:'Nico',dmhy:'动漫花园',age:'AGE',yhdmm:'樱花',pixabay:'Pixabay',pexels:'Pexels',openmovie:'TMDB',omdb:'OMDB',imdb:'IMDB',tubi:'Tubi',pluto:'Pluto',plex:'Plex',kanopy:'Kanopy',openculture:'OC',cupfox:'茶杯狐',ddys:'低端',libvio:'LIBVIO',zxzj:'在线之家',dsxys:'大师兄',bde4:'哔嘀'};
  h+=`<div class="sfilter"><div class="chip f ${curSrc==='all'?'on':''}" tabindex="0" onclick="fSrc('all')">🌐全部(${d.total})</div>`;
  for(const[src,cnt]of Object.entries(counts)) h+=`<div class="chip f ${curSrc===src?'on':''}" tabindex="0" onclick="fSrc('${src}')">${names[src]||src}(${cnt})</div>`;
  h+='</div>';
  if(curSrc!=='all')items=items.filter(i=>i.source===curSrc);
  if(!items.length) h+='<div class="empty"><div class="ei">🔍</div><div class="et">未找到资源</div><div class="eh">换个关键词试试</div></div>';
  else{for(let i=0;i<items.length;i++){const it=items[i];const th=it.thumbnail?`<img src="${it.thumbnail}" alt="" onerror="this.parentElement.innerHTML='🎬'">`:'🎬';const dr=it.duration?`<div class="dur">${it.duration}</div>`:'';const ps=it.play_count?fp(it.play_count)+'播放':'';
  h+=`<div class="wcard f" tabindex="0" onclick="openR(${i})"><div class="thumb">${th}${dr}</div><div class="body"><div class="t">${esc(it.title)}</div>${it.description?`<div class="d">${esc(it.description)}</div>`:''}<div class="f2"><span class="src-tag">${it.source_name}</span>${it.author?`<span class="meta-tag">${it.author}</span>`:''}${ps?`<span class="meta-tag">· ${ps}</span>`:''}</div></div></div>`}}
  if(d.total>20){const tp=Math.ceil(d.total/20);h+=`<div class="pag"><button class="pg f" onclick="gp(${curPage-1})" ${curPage<=1?'disabled':''}>◀ 上一页</button>`;for(let p=Math.max(1,curPage-1);p<=Math.min(tp,curPage+1);p++) h+=`<button class="pg f ${p===curPage?'on':''}" onclick="gp(${p})">${p}</button>`;h+=`<button class="pg f" onclick="gp(${curPage+1})" ${curPage>=tp?'disabled':''}>下一页 ▶</button></div>`}
  c.innerHTML=h;const first=c.querySelector('.wcard,.chip');if(first)first.focus();
}
function fSrc(id){curSrc=id;if(lastResp)renderResults(lastResp)}
function gp(p){if(p<1)return;curPage=p;doSearch();$('#content').scrollTop=0}
function openR(i){
  let items=(lastResp?.items)||[];if(curSrc!=='all')items=items.filter(x=>x.source===curSrc);
  const it=items[i];if(!it)return;
  $('#mT').textContent=it.title;$('#mD').textContent=it.description||'暂无描述';
  const q=enc(curQ);
  $('#mL').innerHTML=`<a class="f" href="${it.url}" target="_blank"><div class="li">${srcI(it.source)}</div><div><div class="ln">在${it.source_name}观看</div><div class="lu">${new URL(it.url).hostname}</div></div></a>`;
  const ex=[{n:'B站',i:'📺',u:`https://search.bilibili.com/all?keyword=${q}`},{n:'YouTube',i:'▶️',u:`https://www.youtube.com/results?search_query=${q}`},{n:'爱奇艺',i:'🟢',u:`https://so.iqiyi.com/so/q_${q}`},{n:'优酷',i:'🔵',u:`https://so.youku.com/search_video/q_${q}`},{n:'腾讯视频',i:'🔷',u:`https://v.qq.com/x/search/?q=${q}`},{n:'芒果TV',i:'🥭',u:`https://so.mgtv.com/so/k-${q}`},{n:'豆瓣',i:'📗',u:`https://search.douban.com/movie/search?search_text=${q}`},{n:'茶杯狐',i:'☕',u:`https://www.cupfox.app/search?key=${q}`},{n:'抖音',i:'🎵',u:`https://www.douyin.com/search/${q}?type=video`},{n:'低端影视',i:'🎬',u:`https://ddys.pro/?s=${q}`},{n:'LIBVIO',i:'🎥',u:`https://www.libvio.me/search/${q}`},{n:'Archive',i:'🏛️',u:`https://archive.org/search?query=${q}&and[]=mediatype%3A%22movies%22`}];
  $('#mE').innerHTML=ex.map(l=>`<a class="f" href="${l.u}" target="_blank"><div class="li">${l.i}</div><div><div class="ln">${l.n}</div><div class="lu">${new URL(l.u).hostname}</div></div></a>`).join('');
  $('#modal').classList.add('show');$('#modal').querySelector('.close').focus();
}
function closeModal(){$('#modal').classList.remove('show');$('#q').focus()}
function srcI(s){return{bilibili:'📺',youtube:'▶️',dailymotion:'🔵',archive:'🏛️',peertube:'🌐',odysee:'🔮',vimeo:'🎞️',rumble:'📢',twitch:'💜',ted:'🎓',douyin:'🎵',kuaishou:'⚡',xigua:'🍉',haokan:'👍',weibo:'🔴',xiaohongshu:'📕',acfun:'🅰️',douban:'📗',crunchyroll:'🍥',mal:'📋',niconico:'🐱',dmhy:'🌸',age:'🔮',yhdmm:'🌸',pixabay:'🎨',pexels:'📸',openmovie:'🎬',omdb:'🎥',imdb:'🏆',tubi:'📺',pluto:'🪐',plex:'📽️',kanopy:'📚',openculture:'🎭',cupfox:'☕',ddys:'🎬',libvio:'🎥',zxzj:'🏠',dsxys:'🐵',bde4:'🔹'}[s]||'🔗'}
function fp(n){if(!n)return'';if(n>=10000)return(n/10000).toFixed(1)+'万';return n+''}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function enc(s){return encodeURIComponent(s)}
init();
</script>
